services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

  api:
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-codebattle}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codebattle}?sslmode=disable
      PUBLIC_ORIGINS: https://${DOMAIN:?Set DOMAIN}

  problem-seed:
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-codebattle}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codebattle}?sslmode=disable

  judge-worker:
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-codebattle}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codebattle}?sslmode=disable

  gateway:
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
