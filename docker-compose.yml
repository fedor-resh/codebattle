name: codebattle

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codebattle}
      POSTGRES_USER: ${POSTGRES_USER:-codebattle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codebattle}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-codebattle}:${POSTGRES_PASSWORD:-codebattle}@postgres:5432/${POSTGRES_DB:-codebattle}?sslmode=disable
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-http://127.0.0.1:8088,http://localhost:8088,http://127.0.0.1:5173,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      problem-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  problem-seed:
    build:
      context: .
      dockerfile: deploy/problem-seed.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-codebattle}:${POSTGRES_PASSWORD:-codebattle}@postgres:5432/${POSTGRES_DB:-codebattle}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [app]

  judge-worker:
    build:
      context: .
      dockerfile: deploy/judge-worker.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      WORKER_HEALTH_ADDR: :8081
      DATABASE_URL: postgres://${POSTGRES_USER:-codebattle}:${POSTGRES_PASSWORD:-codebattle}@postgres:5432/${POSTGRES_DB:-codebattle}?sslmode=disable
      JUDGE_IMAGE: golang:1.26.5-alpine
      JUDGE_SOURCE_VOLUME: codebattle-judge-source
      JUDGE_BINARY_VOLUME: codebattle-judge-bin
    depends_on:
      postgres:
        condition: service_healthy
      problem-seed:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - judge-source:/judge-source
      - judge-bin:/judge-bin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  gateway:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  postgres-data:
  judge-source:
    name: codebattle-judge-source
  judge-bin:
    name: codebattle-judge-bin
